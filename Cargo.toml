[package]
name = "rquickjs-playground"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "playground"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
llrt_abort = "0.8.1-beta"
llrt_buffer = "0.8.1-beta"
llrt_crypto = "0.8.1-beta"
llrt_events = "0.8.1-beta"
llrt_logging = "0.8.1-beta"
llrt_timers = "0.8.1-beta"
llrt_url = "0.8.1-beta"
llrt_util = "0.8.1-beta"
rquickjs = { version = "0.11", features = ["full-async"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uniffi = { version = "0.32.0", features = ["cli"] }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
rquickjs = { version = "0.11", features = ["bindgen"] }
